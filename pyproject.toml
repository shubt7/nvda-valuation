[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nvda-valuation"
version = "0.1.0"
description = "NVIDIA (NVDA) equity valuation: DCF with perpetuity and exit methods, sensitivities, and client and banker reports."
readme = "README.md"
authors = [{ name = "Shubham" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
